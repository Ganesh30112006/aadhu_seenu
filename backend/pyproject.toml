[project]
name = "smart-classroom-backend"
version = "0.1.0"
description = "Device gateway, API, ASR and notes workers for the IoT smart classroom lecture capture system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "structlog>=24.4",
  "argon2-cffi>=23.1",
  "pgvector>=0.3.6",
  "boto3>=1.35",
  "numpy>=1.26",
  "python-multipart>=0.0.12",
  "tzdata>=2024.2",
  "indic-transliteration>=2.3",
]

[project.optional-dependencies]
# Speech-to-text worker (CTranslate2 Whisper + Silero VAD).
asr = ["faster-whisper>=1.1"]
# PDF export (needs Pango/HarfBuzz system libraries; see infra/ec2/setup.sh).
pdf = ["weasyprint>=63", "markdown-it-py>=3.0"]
# Evaluation scripts.
eval = ["jiwer>=3.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "pgserver>=0.1.4",
  "httpx>=0.27",
  "fakeredis>=2.26",
  "jsonschema>=4.23",
  "websockets>=13.1",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = ["db: needs a PostgreSQL database (set TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]  # typographic characters (– · →) are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"tools/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
